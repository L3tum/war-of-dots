# Enable AVX2 (x86-64-v3) for auto-vectorization in release builds.
# Gives ~29% improvement on influence system vs baseline x86-64 (SSE2 only).
# Override per-invocation: RUSTFLAGS="-C target-cpu=native" cargo build --release
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3"]
