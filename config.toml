[llm]
advisor_provider = "openai"
providers = [
  { name = "openai", provider = "openai", model = "gpt-4o", api_key = "${OPENAI_API_KEY}", base_url = "https://api.openai.com" },
  { name = "ollama", provider = "ollama", model = "llama3", base_url = "http://localhost:11434" },
]

[standard_ruleset]
enabled = true
starting_funds = 2000
initial_manpower = 2000
funds_per_city = 1.0
# Ticks per second (valid range 0.1-600, enforced at config load — a
# zero/negative/NaN value would produce a 0 ms tick interval and spin
# the tick loop at 100% CPU).
game_speed = 60
recruitment_rate = 10
water_speed = 1.2

unit_types = [
  { name = "Light Infantry", symbol = "L", men = 100, equipment = ["rifles:100:0.5", "radios:10:2.0"], soft_attack = 10.0, soft_defense = 11.0, hard_attack = 0.0, hard_defense = 0.0, speed = 1.2, max_organisation = 100.0, reinforcement_rate = 5.0, base_attrition = 1.0, fighting_attrition = 2.0, recruitment_cost = 100 },
  { name = "Heavy Infantry", symbol = "H", men = 150, equipment = ["rifles:100:0.5", "anti-tank:20:3.0", "radios:10:2.0"], soft_attack = 15.0, soft_defense = 16.5, hard_attack = 5.0, hard_defense = 10.0, speed = 0.8, max_organisation = 100.0, reinforcement_rate = 3.0, base_attrition = 2.0, fighting_attrition = 3.0, recruitment_cost = 200 },
  { name = "Tank", symbol = "T", men = 30, equipment = ["tanks:1:20.0", "anti-tank:5:3.0", "radios:2:2.0"], soft_attack = 5.0, soft_defense = 10.0, hard_attack = 20.0, hard_defense = 15.0, speed = 1.0, max_organisation = 100.0, reinforcement_rate = 2.0, base_attrition = 5.0, fighting_attrition = 8.0, recruitment_cost = 500 },
]

# Influence / vision balance knobs (playtest without recompiling game logic).
# Vision and influence share one circle per source. unit/city weights add to the
# per-cell influence; radii set the circle sizes. Omit this block to use defaults
# (equal weights, unit r5, city x1.5, hill x2.0).
[standard_ruleset.influence]
unit_weight = 1
city_weight = 1
unit_radius = 5.0
city_radius_multiplier = 1.5
hill_radius_multiplier = 2.0

[storage]
database_path = "war_of_dots.db"
replay_path = "replays"

# --- Connection limits (Sec L2 — see docs/THREAT_MODEL.md) ----------------
[network]
# Max concurrent WebSocket connections (game /ws + spectator /ws/spectator).
# New connections over the cap are rejected with a clear error message and
# WS close code 1013 ("Try Again Later"). The read-only /ws/replay stream
# is not counted but is rejected while the cap is reached.
# Default: 64.
max_ws_connections = 64
# Max concurrent spectators per game. Over-cap joins receive an Error
# message; earlier spectators are unaffected.
# Default: 8.
max_spectators_per_game = 8
# Max concurrent lobbies (Sec M2). A CreateLobby that would exceed the cap
# is rejected with a clear error; existing lobbies are unaffected. Idle
# lobbies (no join activity for 30 minutes) are reaped by a periodic sweep,
# so this also bounds the memory footprint of client-controlled custom unit
# types (up to ~1 MB per lobby).
# Default: 100.
max_lobbies = 100

# --- /debug/* endpoint gate (Sec L1) ---------------------------------------
[debug]
# Request-time gate for /debug/stats and /debug/benchmark (the latter only
# exists with the microbenchmarks feature).
# The routes are only registered in debug builds / with the `debug-overlay`
# feature (same condition as the default); the handlers re-check this flag
# at request time, so a route that is ever exposed must not execute debug
# logic. The default follows the build (true in debug builds / with
# debug-overlay, false in release) — leave it unset to keep that behavior.
# Set `endpoints = false` to disable the endpoints in a debug build.
# endpoints = true