[package]
name = "war-of-dots"
version = "0.1.0"
edition = "2021"
default-run = "war-of-dots"
license = "MIT"
build = "build.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ciborium = "0.2"
bytes = "1"
schemars = { version = "0.8", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
sqlite = "0.36"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
include_dir = "0.7"
thiserror = "1"
futures = "0.3"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
hecs = "0.11"
subtle = "2"
smallvec = "1"

[features]
default = []
debug-overlay = []
microbenchmarks = []
bench-alloc = []

[dev-dependencies]
dhat = "=0.3.3"
# HTTP handler tests (handlers/http.rs): one-shot requests against a real
# GameServer via `tower::ServiceExt::oneshot`.
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "console_client"
path = "src/bin/console_client.rs"

[[bin]]
name = "generate_schema"
path = "src/schema.rs"

[[test]]
name = "bench_runner"
required-features = ["microbenchmarks"]
