[licenses]
# Allowed licenses — permissive and copyleft
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[bans]
# Warn about duplicate crates (multiple versions)
multiple-versions = "warn"

[advisories]
# Block crates with unresolved security advisories.
# (No active ignores. If one is needed, add it with a one-line rationale —
# stale entries are surfaced by `advisory-not-detected` warnings and should
# be pruned; see git history for prunes after the reqwest 0.12 bump.)
ignore = []
